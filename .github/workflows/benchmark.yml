name: benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GOMAXPROCS: 2
      ZIG_BENCH_CONFIG: "disk-v1;public-db;batch=1000;cache-mib=64;M=16;ef=64;input=binary-f32;reopen=true;optimize=ReleaseFast"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate benchmark provenance
        run: |
          python3 scripts/test_zig_benchmark_config.py
          python3 scripts/test_archived_benchmark.py
      - name: Resolve latest Zig reference
        id: resolve_zig
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag=$(gh api --paginate \
            'repos/jeffhajewski/latticedb/tags?per_page=100' \
            --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)
          [[ -n "$latest_tag" ]]
          LATTICE_VERSION=${latest_tag#v}
          [[ "$LATTICE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          zig_ref=$(gh api \
            "repos/jeffhajewski/latticedb/commits/${latest_tag}" \
            --jq '.sha')
          [[ "$zig_ref" =~ ^[0-9a-f]{40}$ ]]

          zon=$(gh api \
            "repos/jeffhajewski/latticedb/contents/build.zig.zon?ref=${latest_tag}" \
            --jq '.content' \
            | base64 --decode)
          declared_lattice_version=$(printf '%s\n' "$zon" \
            | sed -nE 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            | head -n1)
          zig_version=$(printf '%s\n' "$zon" \
            | sed -nE 's/^[[:space:]]*\.minimum_zig_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            | head -n1)
          [[ "$declared_lattice_version" == "$LATTICE_VERSION" ]]
          [[ "$zig_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          zig_download=$(curl --fail --location --silent --show-error \
            https://ziglang.org/download/index.json \
            | jq -er --arg version "$zig_version" \
              '.[$version]["x86_64-linux"] | select(.tarball and .shasum)')
          zig_tarball_url=$(jq -er '.tarball' <<<"$zig_download")
          zig_sha256=$(jq -er '.shasum' <<<"$zig_download")
          [[ "$zig_sha256" =~ ^[0-9a-f]{64}$ ]]

          {
            printf 'LATTICE_VERSION=%s\n' "$LATTICE_VERSION"
            printf 'ZIG_VERSION=%s\n' "$zig_version"
            printf 'ZIG_TAG=%s\n' "$latest_tag"
            printf 'ZIG_REF=%s\n' "$zig_ref"
            printf 'ZIG_TARBALL_URL=%s\n' "$zig_tarball_url"
            printf 'ZIG_SHA256=%s\n' "$zig_sha256"
          } >> "$GITHUB_ENV"
          printf 'zig_ref=%s\n' "$zig_ref" >> "$GITHUB_OUTPUT"
          printf 'Resolved jeffhajewski/latticedb %s (%s) with package %s and minimum Zig %s.\n' \
            "$latest_tag" "$zig_ref" "$LATTICE_VERSION" "$zig_version" >> "$GITHUB_STEP_SUMMARY"
      - name: Download previous main result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          run_id=$(gh run list --workflow benchmark.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [[ -n "$run_id" ]]; then
            download_dir=$(mktemp -d)
            if gh run download "$run_id" --name performance-results --dir "$download_dir"; then
              if [[ -s "$download_dir/current.txt" && -n "$(tr -d '[:space:]' < "$download_dir/revision.txt")" ]] \
                && go run ./scripts/benchcmp.go -validate-go "$download_dir/current.txt"; then
                cp "$download_dir/current.txt" previous/current.txt
                cp "$download_dir/revision.txt" previous/revision.txt
              fi
            fi
          fi

      - name: Install Zig
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --fail --location --silent --show-error \
            "$ZIG_TARBALL_URL" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7.0.1
        with:
          repository: jeffhajewski/latticedb
          ref: ${{ steps.resolve_zig.outputs.zig_ref }}
          path: zig-reference
          persist-credentials: false

      - name: Run benchmarks (maximum scale 100K)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          run_suite() {
            local repo=$1 output=$2
            (
              cd "$repo"
              go test -run '^$' -bench='^(BenchmarkReadRequests|BenchmarkOutgoingEdges|BenchmarkCheckpoint|BenchmarkColdOpen|BenchmarkReaderDuringCommit|BenchmarkMatchedScale10K|BenchmarkPropertyEquality10K|BenchmarkPropertyIndexCommonValue10K)$' -benchmem -benchtime=100ms -count=3 .
              go test -run '^$' -bench='^BenchmarkSingleRecordCommitScaling$/^nodes_(1000|100000)$' -benchmem -benchtime=100ms -count=3 .
              go test -run '^$' -bench='.' -benchmem -benchtime=100ms -count=3 ./internal/store
              go test -run '^$' -bench='^(BenchmarkVectorSearchMatched10K|BenchmarkVectorSearchANNFallback10K|BenchmarkVectorIndexBuild(Clustered128D|ZigHarness))$' -benchmem -benchtime=100ms -count=3 ./internal/engine
              go test -run '^$' -bench='^BenchmarkDeleteHighDegreeNode$' -benchmem -benchtime=100ms -count=3 ./internal/engine
              go test -run '^$' -bench='^BenchmarkQueryMultiHopSlots$' -benchmem -benchtime=1s -count=3 ./internal/engine
              go test -run '^$' -bench='^(BenchmarkVectorSearchScaling|BenchmarkFTSSearchScaling)$/^records_(1000|10000|100000)$' -benchmem -benchtime=100ms -count=3 ./internal/engine
              go test -run '^$' -bench='^BenchmarkVectorSearch(Clustered128D|ZigHarness)$/^(1K|10K|100K)$' -benchmem -benchtime=1x -count=1 ./internal/engine
            ) | tee "$output"
          }

          mkdir -p results
          run_suite "$GITHUB_WORKSPACE" results/current.txt
          go run ./scripts/benchcmp.go -validate-go results/current.txt
          git rev-parse HEAD > results/revision.txt

          if [[ ! -f previous/current.txt ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              BASE_SHA=$(git rev-parse HEAD^)
            fi
            baseline_dir="$RUNNER_TEMP/benchmark-baseline"
            git worktree add --detach "$baseline_dir" "$BASE_SHA"
            run_suite "$baseline_dir" previous/current.txt
            printf '%s\n' "$BASE_SHA" > previous/revision.txt
          fi

      - name: Run public Go disk benchmark (100K)
        run: |
          mkdir -p results/fixtures
          set -o pipefail
          LATTICEDB_VECTOR_FIXTURE_DIR="$GITHUB_WORKSPACE/results/fixtures" \
            go test -timeout 120m -run '^$' -bench '^BenchmarkVectorSearchDisk128D$/^100K$' -benchtime=1x -count=1 . | tee -a results/current.txt
          sha256sum results/fixtures/vectors-100000.bin > results/vector-fixture-sha256.txt

      - name: Run public Zig disk benchmark (100K)
        run: |
          set -euo pipefail
          zig build-exe -O ReleaseFast -lc \
            --dep lattice --dep compat -Mroot=scripts/vector-disk-zig.zig \
            --dep compat --dep lattice -Mlattice=zig-reference/src/main.zig \
            -Mcompat=zig-reference/src/compat.zig \
            -femit-bin="$RUNNER_TEMP/vector-disk-zig"
          env -u LATTICE_BUFFER_POOL_MB "$RUNNER_TEMP/vector-disk-zig" \
            results/fixtures/vectors-100000.bin "$RUNNER_TEMP/vector-disk-zig.db" 2>&1 | tee results/zig.txt
          go run ./scripts/benchcmp.go -validate-zig results/zig.txt
          sha256sum scripts/vector-disk-zig.zig > results/zig-adapter-sha256.txt
          zig_revision=$(git -C "$GITHUB_WORKSPACE/zig-reference" rev-parse HEAD)
          [[ "$zig_revision" == "$ZIG_REF" ]]
          printf '%s\n' "$zig_revision" > results/zig-revision.txt
          printf '%s\n' "$ZIG_VERSION" > results/zig-version.txt
          printf '%s\n' "$LATTICE_VERSION" > results/lattice-version.txt
          printf '%s\n' "$ZIG_SHA256" > results/zig-archive-sha256.txt
          printf '%s\n' "$ZIG_TAG" > results/zig-tag.txt
          printf '%s\n' "$ZIG_REF" > results/zig-ref.txt
          printf '%s\n' "$ZIG_BENCH_CONFIG" > results/zig-bench-config.txt
          (cd results && sha256sum zig.txt > zig-sha256.txt)

      - name: Create comparison report
        run: |
          zig_status='freshly measured public disk API in this run'
          go run ./scripts/benchcmp.go \
            -current results/current.txt \
            -previous previous/current.txt \
            -disk-baseline docs/benchmarks/page-engine-2026-09-27/baseline.txt \
            -disk-baseline-label "page engine f3518b7 (CI 36258284773)" \
            -current-label "$(cat results/revision.txt)" \
            -previous-label "$(cat previous/revision.txt)" \
            -zig results/zig.txt \
            -zig-label "jeffhajewski/latticedb@$(cat results/zig-revision.txt) (Zig $(cat results/zig-version.txt), ReleaseFast; $zig_status)" \
            -zig-fresh=true \
            -output results/report.md
          printf 'Zig reference: %s (Zig %s, ref %s).\n\n' "$zig_status" "$(cat results/zig-version.txt)" "$(cat results/zig-ref.txt)" >> "$GITHUB_STEP_SUMMARY"
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce stable performance gates
        run: |
          go run ./scripts/benchcmp.go \
            -current results/current.txt \
            -previous previous/current.txt \
            -disk-baseline docs/benchmarks/page-engine-2026-09-27/baseline.txt \
            -disk-baseline-label "page engine f3518b7 (CI 36258284773)" \
            -check

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: performance-results
          path: results
          retention-days: 90
