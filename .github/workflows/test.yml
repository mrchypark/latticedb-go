name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test ./...
      - run: go test ./...
        working-directory: conformance/go
      - run: go test -race ./...
        if: runner.os == 'Linux'
      - run: go test -race ./internal/engine -run '^TestConcurrentVectorReadersRebuildAndCancellation$' -count=20
        if: runner.os == 'Linux'
      - run: go test -race ./internal/exporter -run 'Test(CSVConcurrentSubprocessPublicationAndOwnerDeath|ExportPathLockRegistryReclaimsEntries)$' -count=20
        if: runner.os == 'Linux'
