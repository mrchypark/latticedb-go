name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go test ./...
        working-directory: conformance/go
      - run: go test -race ./...
        if: runner.os == 'Linux'
      - run: go test -race ./...
        working-directory: conformance/go
        if: runner.os == 'Linux'
      - name: Cross-compile portable targets
        if: runner.os == 'Linux'
        run: |
          GOOS=solaris GOARCH=amd64 go test -c -o /tmp/latticedb-solaris.test .
          GOOS=aix GOARCH=ppc64 go test -c -o /tmp/latticedb-aix.test .
          GOOS=plan9 GOARCH=amd64 go test -c -o /tmp/latticedb-plan9.test .
          GOOS=js GOARCH=wasm go test -c -o /tmp/latticedb-wasm.test .
          GOOS=wasip1 GOARCH=wasm go test -c -o /tmp/latticedb-wasi.test .
      - run: go test -race ./internal/engine -run '^TestConcurrentVectorReadersRebuildAndCancellation$' -count=20
        if: runner.os == 'Linux'
      - run: go test -race ./internal/exporter -run 'Test(CSVConcurrentSubprocessPublicationAndOwnerDeath|ExportPathLockRegistryReclaimsEntries)$' -count=20
        if: runner.os == 'Linux'
